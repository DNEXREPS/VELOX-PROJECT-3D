name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 3.2.0
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  quality:
    name: Typecheck · Lint · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes static security guards (server-action auth, service-role isolation,
      # additive-only migrations) in tests/unit/security-guards.test.ts.
      - run: npm test
      - name: 3D asset pipeline is reproducible (re-author + re-run, committed output must match)
        run: |
          for f in scripts/assets/authors/*.mts; do npx tsx "$f"; done
          npx tsx scripts/assets/pipeline.mts
          git diff --exit-code -- assets-src public/lab-assets
      - run: npm run build

  database:
    name: Migrations + RLS integration tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated seed is up to date
        run: npm run db:seed:build && git diff --exit-code supabase/seed.sql
      - name: Apply shim, migrations and seed
        run: scripts/db-apply.sh "$DATABASE_URL"
      - run: npm run test:db

  supabase-e2e:
    name: Real Supabase stack · RLS · E2E journey · Security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start local Supabase (applies migrations + seed)
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,supavisor

      - name: Export local stack credentials (throwaway, CI-only)
        run: |
          npx --yes supabase@${SUPABASE_CLI_VERSION} status -o env > /tmp/sb.env
          get() { grep "^$1=" /tmp/sb.env | head -1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "DATABASE_URL=$(get DB_URL)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "SERVER_LOG=${RUNNER_TEMP}/next-start.log"
          } >> "$GITHUB_ENV"

      - name: RLS & hardening suites against the real Supabase Postgres
        run: npm run test:db

      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Build and start the production server
        run: |
          npm run build
          VELOX_LABS=1 nohup npm start > "$SERVER_LOG" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          echo "server did not start"; cat "$SERVER_LOG"; exit 1

      - name: E2E journey (16 steps)
        run: node tests/e2e/journey.e2e.mjs http://localhost:3000 "${RUNNER_TEMP}/e2e-screenshots"

      - name: Security E2E (CSP, uploads, storage cleanup, rate limits, monitoring, auth links)
        run: node tests/e2e/security.e2e.mjs http://localhost:3000

      - name: P0 assembly lab (Chromium; static and Supabase-hosted assets)
        run: |
          npx tsx scripts/assets/publish-local.mts
          E2E_SUPABASE=1 node tests/e2e/assembly-lab.e2e.mjs http://localhost:3000

      - name: Upload screenshots and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            ${{ runner.temp }}/e2e-screenshots
            ${{ runner.temp }}/next-start.log
          retention-days: 7

  webkit-devices:
    name: P0 assembly lab · WebKit (desktop, iPhone, iPad emulation)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@${PLAYWRIGHT_VERSION}
          npx playwright install webkit
      - name: Build and start (labs enabled, no backend needed)
        # Dedicated port on 127.0.0.1: on the macOS runner another process answered on localhost:3000.
        run: |
          npm run build
          VELOX_LABS=1 nohup npx next start -H 127.0.0.1 -p 3107 > "${RUNNER_TEMP}/next.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3107/lab/assembly && exit 0; sleep 1; done
          curl -sS -i http://127.0.0.1:3107/lab/assembly | head -20 || true
          lsof -nP -iTCP -sTCP:LISTEN | head -30 || true
          cat "${RUNNER_TEMP}/next.log"; exit 1
      - name: WebKit desktop
        run: E2E_BROWSER=webkit node tests/e2e/assembly-lab.e2e.mjs http://127.0.0.1:3107
      - name: WebKit · iPhone 15 emulation
        run: E2E_BROWSER=webkit E2E_DEVICE="iPhone 15" node tests/e2e/assembly-lab.e2e.mjs http://127.0.0.1:3107
      - name: WebKit · iPad Pro 11 emulation
        run: E2E_BROWSER=webkit E2E_DEVICE="iPad Pro 11" node tests/e2e/assembly-lab.e2e.mjs http://127.0.0.1:3107
